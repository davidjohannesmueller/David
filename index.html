<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dave's Gym – 30 Day Split</title>
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dave's Gym">
<link id="pwa-manifest" rel="manifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #D4A017;
  --gold2: #F0C040;
  --gold-dim: rgba(212,160,23,0.15);
  --red: #C8002D;
  --bg: #111111;
  --bg2: #181818;
  --bg3: #202020;
  --bg4: #2a2a2a;
  --bg5: #333;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(212,160,23,0.25);
  --text: #f0ece0;
  --text-muted: #888880;
  --text-dim: #aaa;
  --green: #4CAF50;
  --blue: #4a9eff;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Roboto Condensed',sans-serif;
  font-size:15px;
  min-height:100vh;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
}

/* ── HEADER ── */
header {
  background:#0d0d0d;
  border-bottom:2px solid var(--gold);
  padding:0 16px;
  padding-top:env(safe-area-inset-top);
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:calc(60px + env(safe-area-inset-top));
}
.logo { display:flex; align-items:center; gap:10px; }
.logo-icon { width:44px; height:44px; flex-shrink:0; }
.logo-text { display:flex; flex-direction:column; line-height:1; }
.logo-main {
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  letter-spacing:1px;
  color:var(--gold);
}
.logo-sub {
  font-family:'Oswald',sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--text-muted);
  text-transform:uppercase;
  margin-top:2px;
}
.header-day {
  font-family:'Bebas Neue',sans-serif;
  font-size:14px;
  color:var(--text-muted);
  text-align:right;
  line-height:1.1;
}
.header-day strong {
  display:block;
  font-size:24px;
  color:var(--gold);
}

/* ── DAY PROGRESS BAR ── */
.day-progress {
  background:var(--bg2);
  padding:12px 16px;
  border-bottom:1px solid var(--border);
}
.day-progress-bar {
  height:6px;
  background:var(--bg4);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:6px;
}
.day-progress-fill {
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .3s;
}
.day-progress-text {
  display:flex;
  justify-content:space-between;
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:1px;
  color:var(--text-muted);
  text-transform:uppercase;
}

/* ── TABS ── */
nav.tabs {
  display:flex;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:calc(60px + env(safe-area-inset-top));
  z-index:99;
}
.tab {
  flex:1;
  padding:14px 8px;
  text-align:center;
  font-family:'Oswald',sans-serif;
  font-size:13px;
  font-weight:500;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--text-muted);
  background:none;
  border:none;
  border-bottom:3px solid transparent;
  cursor:pointer;
  transition:all .2s;
}
.tab.active {
  color:var(--gold);
  border-bottom-color:var(--gold);
  background:rgba(212,160,23,0.05);
}

/* ── MAIN ── */
main { padding:16px; max-width:600px; margin:0 auto; }

/* ── WEEK SUMMARY ── */
.week-summary {
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  margin-bottom:16px;
}
.week-summary-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;
  letter-spacing:1px;
  color:var(--gold);
  margin-bottom:10px;
}
.week-stats { display:flex; gap:12px; }
.week-stat {
  flex:1;
  background:var(--bg3);
  border-radius:6px;
  padding:10px;
  text-align:center;
}
.week-stat-label {
  font-family:'Oswald',sans-serif;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--text-muted);
}
.week-stat-value {
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;
  color:var(--text);
  margin-top:2px;
}
.week-stat.complete .week-stat-value { color:var(--green); }

/* ── SESSION CARD ── */
.session-card {
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  margin-bottom:14px;
  overflow:hidden;
}
.session-header {
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(90deg,var(--bg3),var(--bg2));
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.session-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  letter-spacing:1px;
  color:var(--gold);
}
.session-meta {
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:1px;
  color:var(--text-muted);
  text-transform:uppercase;
  margin-top:2px;
}
.btn-start {
  background:var(--gold);
  color:#000;
  border:none;
  padding:8px 16px;
  border-radius:6px;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
}
.btn-start:active { transform:scale(0.96); }

/* ── EXERCISE LIST ── */
.exercise-list { padding:8px 0; }
.exercise {
  padding:12px 14px;
  border-bottom:1px solid var(--border);
}
.exercise:last-child { border-bottom:none; }
.exercise-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.exercise-name {
  font-family:'Oswald',sans-serif;
  font-size:15px;
  font-weight:500;
  color:var(--text);
}
.exercise-progress {
  font-family:'Oswald',sans-serif;
  font-size:11px;
  color:var(--text-muted);
  letter-spacing:1px;
}
.exercise.complete .exercise-name { color:var(--green); }
.exercise-suggestion {
  font-family:'Oswald',sans-serif;
  font-size:11px;
  color:var(--gold2);
  background:var(--gold-dim);
  padding:4px 8px;
  border-radius:4px;
  margin-top:6px;
  display:inline-block;
  letter-spacing:.5px;
}

/* ── SET ROW ── */
.sets { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.set-row {
  display:grid;
  grid-template-columns:24px 1fr 1fr 36px;
  gap:8px;
  align-items:center;
  padding:6px 0;
}
.set-num {
  font-family:'Oswald',sans-serif;
  font-size:12px;
  color:var(--text-muted);
  text-align:center;
}
.set-input {
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:5px;
  padding:8px 10px;
  font-family:'Oswald',sans-serif;
  font-size:14px;
  color:var(--text);
  text-align:center;
  width:100%;
  -moz-appearance:textfield;
}
.set-input::-webkit-outer-spin-button,
.set-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.set-input:focus { outline:none; border-color:var(--gold); background:var(--bg4); }
.set-input.placeholder-shown { color:var(--text-muted); }
.set-check {
  width:36px;
  height:36px;
  border-radius:6px;
  background:var(--bg3);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
  color:var(--text-muted);
  transition:all .15s;
}
.set-check.done {
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}
.set-check:active { transform:scale(0.92); }

.set-labels {
  display:grid;
  grid-template-columns:24px 1fr 1fr 36px;
  gap:8px;
  font-family:'Oswald',sans-serif;
  font-size:9px;
  letter-spacing:1px;
  color:var(--text-muted);
  text-transform:uppercase;
  padding:0 0 4px 0;
}
.set-labels span { text-align:center; }

/* ── RUN CARD ── */
.run-card {
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  margin-bottom:14px;
}
.run-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.run-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  color:var(--gold);
  letter-spacing:1px;
}
.run-inputs {
  display:grid;
  grid-template-columns:1fr 1fr 50px;
  gap:8px;
  align-items:center;
}
.run-input-group { display:flex; flex-direction:column; }
.run-input-label {
  font-family:'Oswald',sans-serif;
  font-size:9px;
  letter-spacing:1px;
  color:var(--text-muted);
  text-transform:uppercase;
  margin-bottom:3px;
}

/* ── EVALUATION ── */
.eval-modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  z-index:200;
  display:none;
  flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-y:auto;
}
.eval-modal.show { display:flex; }
.eval-content {
  max-width:600px;
  width:100%;
  margin:0 auto;
  padding:20px;
}
.eval-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:36px;
  color:var(--gold);
  text-align:center;
  letter-spacing:2px;
  margin-bottom:6px;
}
.eval-sub {
  text-align:center;
  font-family:'Oswald',sans-serif;
  font-size:12px;
  color:var(--text-muted);
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:24px;
}
.eval-stats {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
.eval-stat {
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:8px;
  padding:14px;
  text-align:center;
}
.eval-stat-label {
  font-family:'Oswald',sans-serif;
  font-size:10px;
  letter-spacing:1px;
  color:var(--text-muted);
  text-transform:uppercase;
}
.eval-stat-value {
  font-family:'Bebas Neue',sans-serif;
  font-size:32px;
  color:var(--gold);
  margin-top:4px;
}
.eval-section {
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  margin-bottom:12px;
}
.eval-section-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:18px;
  color:var(--gold);
  margin-bottom:10px;
  letter-spacing:1px;
}
.eval-row {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid var(--border);
  font-family:'Oswald',sans-serif;
  font-size:13px;
}
.eval-row:last-child { border-bottom:none; }
.eval-row-label { color:var(--text-dim); }
.eval-row-value { color:var(--gold2); font-weight:600; }

.btn-primary {
  background:var(--gold);
  color:#000;
  border:none;
  padding:14px;
  border-radius:8px;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  width:100%;
  margin-top:8px;
}
.btn-secondary {
  background:transparent;
  color:var(--text-muted);
  border:1px solid var(--border);
  padding:12px;
  border-radius:8px;
  font-family:'Oswald',sans-serif;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  width:100%;
  margin-top:8px;
}

/* ── HISTORY ── */
.history-day {
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
  margin-bottom:10px;
}
.history-day-head {
  display:flex;
  justify-content:space-between;
  font-family:'Oswald',sans-serif;
  font-size:13px;
  margin-bottom:6px;
}
.history-day-date { color:var(--gold); letter-spacing:1px; }
.history-day-type { color:var(--text-muted); text-transform:uppercase; font-size:11px; }
.history-detail {
  font-family:'Roboto Condensed',sans-serif;
  font-size:13px;
  color:var(--text-dim);
  line-height:1.5;
}

/* ── EMPTY ── */
.empty {
  text-align:center;
  padding:40px 20px;
  color:var(--text-muted);
  font-family:'Oswald',sans-serif;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* ── TIMER ── */
.timer-bar {
  position:fixed;
  bottom:env(safe-area-inset-bottom);
  left:0;
  right:0;
  background:#0d0d0d;
  border-top:2px solid var(--gold);
  padding:10px 16px;
  display:none;
  align-items:center;
  justify-content:space-between;
  z-index:90;
}
.timer-bar.show { display:flex; }
.timer-label {
  font-family:'Oswald',sans-serif;
  font-size:10px;
  letter-spacing:2px;
  color:var(--text-muted);
  text-transform:uppercase;
}
.timer-value {
  font-family:'Bebas Neue',sans-serif;
  font-size:28px;
  color:var(--gold);
  letter-spacing:2px;
}
.timer-stop {
  background:var(--red);
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:6px;
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
}

/* ── HIDDEN ── */
.hidden { display:none !important; }

/* ── ANIMATIONS ── */
@keyframes pop { 0%{transform:scale(.8);opacity:0;} 100%{transform:scale(1);opacity:1;} }
.pop { animation:pop .2s ease-out; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="topArc" d="M 15,50 A 35,35 0 0 1 85,50" />
        <path id="botArc" d="M 18,52 A 32,32 0 0 0 82,52" />
      </defs>
      <circle cx="50" cy="50" r="48" fill="#000" stroke="#D4A017" stroke-width="2"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#D4A017" stroke-width="1"/>
      <!-- Body -->
      <circle cx="50" cy="32" r="5" fill="#D4A017"/>
      <path d="M 42,38 Q 50,36 58,38 L 62,50 L 58,52 L 50,48 L 42,52 L 38,50 Z" fill="#D4A017"/>
      <!-- Arms -->
      <path d="M 36,40 L 28,50 L 26,54" stroke="#D4A017" stroke-width="3" stroke-linecap="round" fill="none"/>
      <rect x="20" y="51" width="12" height="4" rx="2" fill="#D4A017"/>
      <rect x="19" y="49" width="3" height="8" rx="1.5" fill="#D4A017"/>
      <rect x="30" y="49" width="3" height="8" rx="1.5" fill="#D4A017"/>
      <path d="M 64,40 L 72,50 L 74,54" stroke="#D4A017" stroke-width="3" stroke-linecap="round" fill="none"/>
      <rect x="68" y="51" width="12" height="4" rx="2" fill="#D4A017"/>
      <rect x="67" y="49" width="3" height="8" rx="1.5" fill="#D4A017"/>
      <rect x="78" y="49" width="3" height="8" rx="1.5" fill="#D4A017"/>
      <!-- Legs -->
      <path d="M 45,52 L 43,68 L 47,68 L 50,58 L 53,68 L 57,68 L 55,52 Z" fill="#D4A017"/>
      <text font-family="Arial Black,sans-serif" font-size="9" font-weight="900" fill="#D4A017" letter-spacing="2">
        <textPath href="#topArc" startOffset="14%">DAVE'S</textPath>
      </text>
      <text font-family="Arial Black,sans-serif" font-size="9" font-weight="900" fill="#D4A017" letter-spacing="3">
        <textPath href="#botArc" startOffset="32%">GYM</textPath>
      </text>
    </svg>
    <div class="logo-text">
      <span class="logo-main">Dave's Gym</span>
      <span class="logo-sub">30 Day Split</span>
    </div>
  </div>
  <div class="header-day">
    Tag<br><strong id="dayCounter">1</strong>
  </div>
</header>

<div class="day-progress">
  <div class="day-progress-bar"><div class="day-progress-fill" id="dayProgressFill" style="width:0%"></div></div>
  <div class="day-progress-text">
    <span id="dayProgressText">Tag 1 / 30</span>
    <span id="planLabel">Plan 1</span>
  </div>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="today">Heute</button>
  <button class="tab" data-tab="week">Woche</button>
  <button class="tab" data-tab="history">Historie</button>
</nav>

<main>
  <!-- TODAY -->
  <section id="tab-today">
    <div class="week-summary">
      <div class="week-summary-title">Diese Woche – KW <span id="weekNum"></span></div>
      <div class="week-stats">
        <div class="week-stat" id="statKraft">
          <div class="week-stat-label">Kraft</div>
          <div class="week-stat-value"><span id="kraftDone">0</span>/4</div>
        </div>
        <div class="week-stat" id="statRun">
          <div class="week-stat-label">Lauf</div>
          <div class="week-stat-value"><span id="runDone">0</span>/2</div>
        </div>
      </div>
    </div>

    <div id="sessionContainer"></div>
  </section>

  <!-- WEEK -->
  <section id="tab-week" class="hidden">
    <div id="weekView"></div>
  </section>

  <!-- HISTORY -->
  <section id="tab-history" class="hidden">
    <div id="historyView"></div>
  </section>
</main>

<div class="timer-bar" id="timerBar">
  <div>
    <div class="timer-label">Pause</div>
    <div class="timer-value" id="timerValue">00:00</div>
  </div>
  <button class="timer-stop" onclick="stopTimer()">Stop</button>
</div>

<!-- EVALUATION MODAL -->
<div class="eval-modal" id="evalModal">
  <div class="eval-content" id="evalContent"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════

const PLAN = {
  upper: {
    name: "Oberkörper",
    type: "kraft",
    exercises: [
      { name: "Schrägbankdrücken", sets: 2 },
      { name: "Latzug", sets: 2 },
      { name: "Butterfly", sets: 2 },
      { name: "Rudern Kabelturm", sets: 2 },
      { name: "Seitheben", sets: 4 },
      { name: "Biceps Curls", sets: 2 },
      { name: "Triceps Pushdowns", sets: 2 }
    ]
  },
  lower: {
    name: "Unterkörper",
    type: "kraft",
    exercises: [
      { name: "Adduktoren", sets: 2 },
      { name: "Beinbeuger sitzend", sets: 2 },
      { name: "Squats", sets: 2 },
      { name: "Romanisches Kreuzheben", sets: 2 },
      { name: "Beinstrecker", sets: 2 },
      { name: "Wadenheben", sets: 3 }
    ]
  },
  run: {
    name: "Laufen",
    type: "run"
  }
};

// State persisted in localStorage
let state = loadState();

function loadState() {
  const raw = localStorage.getItem("daves-gym-30day");
  if (raw) {
    try { return JSON.parse(raw); } catch(e) {}
  }
  return {
    planNumber: 1,
    startDate: new Date().toISOString().slice(0,10),
    sessions: [],          // {date, type:'upper'|'lower'|'run', exercises:[{name, sets:[{w, r, done}]}], distance, time}
    lastWeights: {},       // {exerciseName: {weight, reps}}
    activeSession: null    // current in-progress
  };
}

function saveState() {
  localStorage.setItem("daves-gym-30day", JSON.stringify(state));
}

// ═══════════════════════════════════════════════
// DAY CALC
// ═══════════════════════════════════════════════

function getDayNumber() {
  const start = new Date(state.startDate);
  const today = new Date();
  const diff = Math.floor((today - start) / (1000*60*60*24));
  return diff + 1;
}

function getCurrentISOWeek() {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
}

function getWeekKey(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
  return `${d.getFullYear()}-KW${week}`;
}

// ═══════════════════════════════════════════════
// UI – HEADER & PROGRESS
// ═══════════════════════════════════════════════

function renderHeader() {
  const day = getDayNumber();
  const capped = Math.min(day, 30);
  document.getElementById("dayCounter").textContent = capped;
  document.getElementById("dayProgressFill").style.width = (capped/30*100) + "%";
  document.getElementById("dayProgressText").textContent = `Tag ${capped} / 30`;
  document.getElementById("planLabel").textContent = `Plan ${state.planNumber}`;
  document.getElementById("weekNum").textContent = getCurrentISOWeek();

  if (day > 30) {
    showEvaluation();
  }
}

// ═══════════════════════════════════════════════
// WEEK STATS
// ═══════════════════════════════════════════════

function renderWeekStats() {
  const wk = getWeekKey(new Date());
  const thisWeek = state.sessions.filter(s => getWeekKey(s.date) === wk);
  const kraft = thisWeek.filter(s => s.type === "upper" || s.type === "lower").length;
  const run = thisWeek.filter(s => s.type === "run").length;
  document.getElementById("kraftDone").textContent = kraft;
  document.getElementById("runDone").textContent = run;
  document.getElementById("statKraft").classList.toggle("complete", kraft >= 4);
  document.getElementById("statRun").classList.toggle("complete", run >= 2);
}

// ═══════════════════════════════════════════════
// SESSION RENDER
// ═══════════════════════════════════════════════

function renderToday() {
  const c = document.getElementById("sessionContainer");
  c.innerHTML = "";

  // Active session?
  if (state.activeSession) {
    c.appendChild(renderActiveSession());
    return;
  }

  // Show 3 quick-start cards: Upper, Lower, Run
  ["upper","lower","run"].forEach(type => {
    c.appendChild(renderStartCard(type));
  });
}

function renderStartCard(type) {
  const card = document.createElement("div");
  card.className = "session-card";
  const def = type === "run" ? PLAN.run : PLAN[type];
  const meta = type === "run" ? "Distanz + Zeit" : `${def.exercises.length} Übungen`;
  card.innerHTML = `
    <div class="session-header">
      <div>
        <div class="session-title">${def.name}</div>
        <div class="session-meta">${meta}</div>
      </div>
      <button class="btn-start" data-start="${type}">Start</button>
    </div>
  `;
  card.querySelector("[data-start]").onclick = () => startSession(type);
  return card;
}

function renderActiveSession() {
  const wrap = document.createElement("div");
  wrap.className = "session-card";
  const s = state.activeSession;
  const def = s.type === "run" ? PLAN.run : PLAN[s.type];

  if (s.type === "run") {
    wrap.innerHTML = `
      <div class="session-header">
        <div>
          <div class="session-title">${def.name}</div>
          <div class="session-meta">Eingabe</div>
        </div>
      </div>
      <div class="exercise">
        <div class="run-inputs">
          <div class="run-input-group">
            <span class="run-input-label">Distanz (km)</span>
            <input type="number" step="0.1" class="set-input" id="runDist" value="${s.distance||""}" placeholder="0.0">
          </div>
          <div class="run-input-group">
            <span class="run-input-label">Zeit (min)</span>
            <input type="number" class="set-input" id="runTime" value="${s.time||""}" placeholder="0">
          </div>
          <button class="set-check" id="runDone" style="width:100%;height:42px">✓</button>
        </div>
        <button class="btn-secondary" onclick="cancelSession()">Abbrechen</button>
      </div>
    `;
    setTimeout(() => {
      document.getElementById("runDone").onclick = finishRun;
      document.getElementById("runDist").oninput = e => { s.distance = parseFloat(e.target.value)||0; saveState(); };
      document.getElementById("runTime").oninput = e => { s.time = parseInt(e.target.value)||0; saveState(); };
    }, 0);
    return wrap;
  }

  // Strength session
  wrap.innerHTML = `
    <div class="session-header">
      <div>
        <div class="session-title">${def.name}</div>
        <div class="session-meta">2-3 Sätze · 5-8 Wdh</div>
      </div>
      <button class="btn-start" onclick="finishStrengthSession()">Fertig</button>
    </div>
    <div class="exercise-list" id="exList"></div>
  `;
  setTimeout(() => renderExerciseList(s, wrap), 0);
  return wrap;
}

function renderExerciseList(s, wrap) {
  const list = wrap.querySelector("#exList");
  list.innerHTML = "";
  s.exercises.forEach((ex, exIdx) => {
    const last = state.lastWeights[ex.name];
    const allDone = ex.sets.every(set => set.done);
    const lastSet = ex.sets[ex.sets.length-1];
    const suggestUp = allDone && lastSet.r > 8;

    const div = document.createElement("div");
    div.className = "exercise" + (allDone ? " complete" : "");
    div.innerHTML = `
      <div class="exercise-header">
        <span class="exercise-name">${ex.name}</span>
        <span class="exercise-progress">${ex.sets.filter(x=>x.done).length}/${ex.sets.length}</span>
      </div>
      ${suggestUp ? `<div class="exercise-suggestion">⬆ Beim nächsten Mal +2.5 kg</div>` : ""}
      <div class="set-labels">
        <span></span><span>Gewicht</span><span>Wdh</span><span></span>
      </div>
      <div class="sets"></div>
    `;
    const setsDiv = div.querySelector(".sets");
    ex.sets.forEach((set, setIdx) => {
      const row = document.createElement("div");
      row.className = "set-row";
      const placeholderW = last ? last.weight : "";
      const placeholderR = last ? last.reps : "";
      row.innerHTML = `
        <span class="set-num">${setIdx+1}</span>
        <input type="number" step="0.5" class="set-input" placeholder="${placeholderW}" value="${set.w||""}" data-w="${exIdx}-${setIdx}">
        <input type="number" class="set-input" placeholder="${placeholderR}" value="${set.r||""}" data-r="${exIdx}-${setIdx}">
        <div class="set-check ${set.done?"done":""}" data-done="${exIdx}-${setIdx}">✓</div>
      `;
      setsDiv.appendChild(row);
    });
    list.appendChild(div);
  });

  // Bind inputs
  wrap.querySelectorAll("[data-w]").forEach(inp => {
    inp.oninput = e => {
      const [ex,set] = e.target.dataset.w.split("-").map(Number);
      s.exercises[ex].sets[set].w = parseFloat(e.target.value)||0;
      saveState();
    };
  });
  wrap.querySelectorAll("[data-r]").forEach(inp => {
    inp.oninput = e => {
      const [ex,set] = e.target.dataset.r.split("-").map(Number);
      s.exercises[ex].sets[set].r = parseInt(e.target.value)||0;
      saveState();
    };
  });
  wrap.querySelectorAll("[data-done]").forEach(btn => {
    btn.onclick = e => {
      const [ex,set] = e.currentTarget.dataset.done.split("-").map(Number);
      const setObj = s.exercises[ex].sets[set];
      setObj.done = !setObj.done;
      // Carry over last value if empty
      if (setObj.done) {
        const last = state.lastWeights[s.exercises[ex].name];
        if (!setObj.w && last) setObj.w = last.weight;
        if (!setObj.r && last) setObj.r = last.reps;
        startTimer(120);
      }
      saveState();
      renderExerciseList(s, wrap);
    };
  });
}

// ═══════════════════════════════════════════════
// SESSION CONTROL
// ═══════════════════════════════════════════════

function startSession(type) {
  if (type === "run") {
    state.activeSession = {
      date: new Date().toISOString(),
      type: "run",
      distance: 0,
      time: 0
    };
  } else {
    const def = PLAN[type];
    state.activeSession = {
      date: new Date().toISOString(),
      type: type,
      exercises: def.exercises.map(ex => ({
        name: ex.name,
        sets: Array.from({length:ex.sets},()=>({w:0,r:0,done:false}))
      }))
    };
  }
  saveState();
  renderToday();
}

function cancelSession() {
  if (!confirm("Session verwerfen?")) return;
  state.activeSession = null;
  saveState();
  renderToday();
}

function finishStrengthSession() {
  const s = state.activeSession;
  const completedSets = s.exercises.flatMap(e=>e.sets).filter(set=>set.done).length;
  if (completedSets === 0) {
    if (!confirm("Keine Sätze abgehakt – trotzdem speichern?")) return;
  }
  // Update lastWeights
  s.exercises.forEach(ex => {
    const lastDone = ex.sets.filter(set=>set.done).pop();
    if (lastDone && lastDone.w > 0) {
      state.lastWeights[ex.name] = { weight: lastDone.w, reps: lastDone.r };
    }
  });
  state.sessions.push(s);
  state.activeSession = null;
  stopTimer();
  saveState();
  renderAll();
}

function finishRun() {
  const s = state.activeSession;
  if (!s.distance && !s.time) {
    alert("Bitte Distanz oder Zeit eingeben.");
    return;
  }
  state.sessions.push(s);
  state.activeSession = null;
  saveState();
  renderAll();
}

// ═══════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════

let timerInterval = null;
let timerEnd = 0;

function startTimer(seconds) {
  stopTimer();
  timerEnd = Date.now() + seconds*1000;
  document.getElementById("timerBar").classList.add("show");
  tickTimer();
  timerInterval = setInterval(tickTimer, 200);
}
function tickTimer() {
  const ms = timerEnd - Date.now();
  if (ms <= 0) {
    document.getElementById("timerValue").textContent = "00:00";
    document.getElementById("timerValue").style.color = "var(--green)";
    clearInterval(timerInterval);
    if (navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(stopTimer, 2000);
    return;
  }
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const sec = s%60;
  document.getElementById("timerValue").textContent =
    String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
  document.getElementById("timerValue").style.color = "var(--gold)";
}
function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById("timerBar").classList.remove("show");
}

// ═══════════════════════════════════════════════
// WEEK VIEW
// ═══════════════════════════════════════════════

function renderWeek() {
  const c = document.getElementById("weekView");
  c.innerHTML = "";
  // Group sessions by week
  const groups = {};
  state.sessions.forEach(s => {
    const wk = getWeekKey(s.date);
    if (!groups[wk]) groups[wk] = [];
    groups[wk].push(s);
  });
  const keys = Object.keys(groups).sort().reverse();
  if (!keys.length) {
    c.innerHTML = `<div class="empty">Noch keine Trainings</div>`;
    return;
  }
  keys.forEach(wk => {
    const sessions = groups[wk];
    const kraft = sessions.filter(s=>s.type!=="run").length;
    const run = sessions.filter(s=>s.type==="run").length;
    const div = document.createElement("div");
    div.className = "session-card";
    div.innerHTML = `
      <div class="session-header">
        <div>
          <div class="session-title">${wk}</div>
          <div class="session-meta">${sessions.length} Sessions</div>
        </div>
        <div style="text-align:right">
          <div style="color:${kraft>=4?'var(--green)':'var(--text-muted)'};font-family:Oswald;font-size:13px">Kraft ${kraft}/4</div>
          <div style="color:${run>=2?'var(--green)':'var(--text-muted)'};font-family:Oswald;font-size:13px">Lauf ${run}/2</div>
        </div>
      </div>
    `;
    c.appendChild(div);
  });
}

// ═══════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════

function renderHistory() {
  const c = document.getElementById("historyView");
  c.innerHTML = "";
  const sorted = [...state.sessions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if (!sorted.length) {
    c.innerHTML = `<div class="empty">Noch keine Trainings</div>`;
    return;
  }
  sorted.forEach((s,idx) => {
    const date = new Date(s.date);
    const dStr = date.toLocaleDateString("de-DE", {weekday:"short",day:"2-digit",month:"2-digit"});
    const div = document.createElement("div");
    div.className = "history-day";
    let detail = "";
    if (s.type === "run") {
      detail = `${s.distance||0} km · ${s.time||0} min`;
    } else {
      const def = PLAN[s.type];
      const totalSets = s.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);
      detail = `${totalSets} Sätze · ${def.exercises.length} Übungen`;
    }
    const typeLabel = s.type === "run" ? "Lauf" : (s.type === "upper" ? "Oberkörper" : "Unterkörper");
    div.innerHTML = `
      <div class="history-day-head">
        <span class="history-day-date">${dStr}</span>
        <span class="history-day-type">${typeLabel}</span>
      </div>
      <div class="history-detail">${detail}</div>
    `;
    c.appendChild(div);
  });
}

// ═══════════════════════════════════════════════
// EVALUATION (after day 30)
// ═══════════════════════════════════════════════

function showEvaluation() {
  const planSessions = state.sessions.filter(s => new Date(s.date) >= new Date(state.startDate));
  const upper = planSessions.filter(s=>s.type==="upper").length;
  const lower = planSessions.filter(s=>s.type==="lower").length;
  const runs = planSessions.filter(s=>s.type==="run");
  const totalKm = runs.reduce((a,r)=>a+(r.distance||0),0);
  const totalMin = runs.reduce((a,r)=>a+(r.time||0),0);
  const totalSets = planSessions.flatMap(s=>s.exercises||[]).reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0);

  // Top progress per exercise
  const progress = {};
  planSessions.filter(s=>s.exercises).forEach(s => {
    s.exercises.forEach(ex => {
      const done = ex.sets.filter(x=>x.done && x.w>0);
      if (!done.length) return;
      const max = Math.max(...done.map(x=>x.w));
      if (!progress[ex.name] || max > progress[ex.name].max) {
        progress[ex.name] = progress[ex.name] || {start:max,max:max};
      }
      if (max > progress[ex.name].max) progress[ex.name].max = max;
      if (max < progress[ex.name].start) progress[ex.name].start = max;
    });
  });
  const progRows = Object.entries(progress)
    .map(([name,p]) => ({name, gain: p.max - p.start, max: p.max}))
    .sort((a,b)=>b.gain-a.gain)
    .slice(0,5);

  const c = document.getElementById("evalContent");
  c.innerHTML = `
    <div class="eval-title">30 Tage geschafft</div>
    <div class="eval-sub">Plan ${state.planNumber} – Auswertung</div>

    <div class="eval-stats">
      <div class="eval-stat"><div class="eval-stat-label">Kraft Sessions</div><div class="eval-stat-value">${upper+lower}</div></div>
      <div class="eval-stat"><div class="eval-stat-label">Läufe</div><div class="eval-stat-value">${runs.length}</div></div>
      <div class="eval-stat"><div class="eval-stat-label">Sätze gesamt</div><div class="eval-stat-value">${totalSets}</div></div>
      <div class="eval-stat"><div class="eval-stat-label">Lauf km</div><div class="eval-stat-value">${totalKm.toFixed(1)}</div></div>
    </div>

    <div class="eval-section">
      <div class="eval-section-title">Aufteilung</div>
      <div class="eval-row"><span class="eval-row-label">Oberkörper</span><span class="eval-row-value">${upper} / 8</span></div>
      <div class="eval-row"><span class="eval-row-label">Unterkörper</span><span class="eval-row-value">${lower} / 8</span></div>
      <div class="eval-row"><span class="eval-row-label">Lauf</span><span class="eval-row-value">${runs.length} / 8</span></div>
      <div class="eval-row"><span class="eval-row-label">Lauf Zeit gesamt</span><span class="eval-row-value">${totalMin} min</span></div>
    </div>

    ${progRows.length ? `
    <div class="eval-section">
      <div class="eval-section-title">Top Fortschritt</div>
      ${progRows.map(p=>`
        <div class="eval-row">
          <span class="eval-row-label">${p.name}</span>
          <span class="eval-row-value">+${p.gain} kg → ${p.max} kg</span>
        </div>`).join("")}
    </div>` : ""}

    <button class="btn-primary" onclick="startNewPlan()">Neuen 30-Tage-Plan starten</button>
    <button class="btn-secondary" onclick="closeEvaluation()">Später</button>
  `;
  document.getElementById("evalModal").classList.add("show");
}

function closeEvaluation() {
  document.getElementById("evalModal").classList.remove("show");
}

function startNewPlan() {
  if (!confirm("Plan " + state.planNumber + " abschließen und Plan " + (state.planNumber+1) + " starten?\n\nDie Historie bleibt erhalten.")) return;
  state.planNumber += 1;
  state.startDate = new Date().toISOString().slice(0,10);
  saveState();
  closeEvaluation();
  renderAll();
}

// ═══════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.querySelectorAll("main > section").forEach(s=>s.classList.add("hidden"));
    document.getElementById("tab-"+t.dataset.tab).classList.remove("hidden");
    if (t.dataset.tab === "week") renderWeek();
    if (t.dataset.tab === "history") renderHistory();
  };
});
