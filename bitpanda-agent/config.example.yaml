# Multi-asset trading agent configuration.
# Copy to config.yaml and adjust.

poll_interval_seconds: 10

# ── Venues ──────────────────────────────────────────────────────────────
# Each exchange declares which instruments it trades. The agent routes every
# instrument to the venue that owns it. Credentials come from .env.
#
# Recommended start: Alpaca paper trading (free, works in the EU for paper).
# Enable OANDA / Bitpanda once you have their (practice) keys.
exchanges:
  - type: alpaca
    asset_class: stocks
    instruments: [AAPL, MSFT, SPY]

  - type: alpaca
    asset_class: crypto
    instruments: [BTC/USD, ETH/USD]

  # Forex via OANDA practice account (Alpaca has no forex). Add keys to enable.
  # - type: oanda
  #   asset_class: forex
  #   instruments: [EUR_USD, GBP_USD]

  # EU crypto live trading later (read the safety notes first).
  # - type: bitpanda
  #   asset_class: crypto
  #   instruments: [BTC_EUR, ETH_EUR]

# ── Risk limits (hard guardrails, enforced before every order) ──────────
risk:
  max_order_notional_eur: 1000     # cap per single order (quote currency)
  max_total_exposure_eur: 5000     # cap on total deployed capital
  max_daily_loss_eur: 250          # halt trading for the day when hit

# ── Strategies ──────────────────────────────────────────────────────────
# Start with ONE strategy (trend-following) until the mechanics are proven.
strategies:
  trend_following:
    enabled: true
    # Runs across any asset class — list instruments from the venues above.
    instruments: [AAPL, MSFT, SPY, BTC/USD, ETH/USD]
    fast_period: 20
    slow_period: 50
    trailing_stop_pct: 3.0
    trade_notional: 1000

  # Optional extras — off by default. Enable when you are ready.
  triangular_arbitrage:
    enabled: false
    cycle: [BTC_EUR, ETH_BTC, ETH_EUR]
    min_profit_pct: 0.3
    taker_fee_pct: 0.15
    trade_notional_eur: 30
